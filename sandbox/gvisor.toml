# Skill Forge — gVisor 深度审计配置（**未接线**）
# 使用 OpenSandbox (osb) 作为编排层

[secure_runtime]
type = "gvisor"
docker_runtime = "runsc"

# 网络策略 — 仅允许 Claude API
[network]
mode = "restricted"
allowed_domains = [
    "api.anthropic.com",
    "api.github.com",
    "raw.githubusercontent.com",
]
deny_all_other = true

# 文件系统
[filesystem]
# 只读挂载
read_only_mounts = [
    { source = "{{SKILL_PATH}}", target = "/skill" },
]
# 可写（仅 /tmp）
writable_paths = ["/tmp"]

# 资源限制
[resources]
max_memory_mb = 512
max_cpu_cores = 1
max_processes = 50
timeout_seconds = 120

# 审计
[audit]
log_syscalls = true
log_file_access = true
log_network = true
output_format = "json"
output_path = "/tmp/audit-report.json"

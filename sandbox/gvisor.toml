#
# 全仓库 grep `gvisor` / `runsc` / `OpenSandbox`：除了本文件自己，
# 只有 verify/l5_sandbox.py 的 docstring 在**说明它不存在**。
#
# 也就是说：所谓「gVisor 深度审计」目前是个承诺，不是功能。
# 2026-10-05 的审计把它当成"标签在、功能不在"的一条抓了出来。
#
# 两种处理方式，选一种：
#   1. 真接上（写编排代码、让 l5_sandbox 在有 runsc 时用它）
#   2. 或者删掉本文件，别让后来的人以为有这条路
